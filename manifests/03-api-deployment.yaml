apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina-wagyu
  labels:
    app: oficina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
        - name: oficina-api
          # Troque pela imagem publicada no ECR pelo pipeline de CI/CD do
          # repositório da aplicação (oficina-wagyu-app).
          image: <SUBSTITUIR_PELA_URI_DO_ECR>:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina-wagyu
spec:
  selector:
    app: oficina-api
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
