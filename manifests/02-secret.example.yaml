# ⚠️ NÃO preencha valores reais aqui e não commite este arquivo com dados
# sensíveis. Prefira criar o Secret diretamente via linha de comando,
# usando o output do repositório oficina-wagyu-infra-database:
#
#   kubectl create namespace oficina-wagyu --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl create secret generic oficina-api-secret -n oficina-wagyu \
#     --from-literal=ConnectionStrings__DefaultConnection="$(cd ../oficina-wagyu-infra-database && terraform output -raw connection_string)" \
#     --from-literal=EmailWebhook__Secret='SEU_SEGREDO_AQUI' \
#     --from-literal=Jwt__Secret='SEU_SEGREDO_JWT_COMPARTILHADO_COM_A_LAMBDA'
#
# Este arquivo fica no repositório apenas como referência de quais chaves
# o Secret precisa ter.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secret
  namespace: oficina-wagyu
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "PREENCHER_VIA_KUBECTL_CREATE_SECRET"
  EmailWebhook__Secret: "PREENCHER_VIA_KUBECTL_CREATE_SECRET"
  Jwt__Secret: "PREENCHER_VIA_KUBECTL_CREATE_SECRET"
